name: Publish Joy site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "assets/*.cast"
      - "assets/joy.svg"
      - "assets/ownership.svg"
      - "index.html"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate repository
        run: node scripts/validate.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage static site
        run: |
          mkdir -p _site/assets _site/site
          cp index.html _site/index.html
          cp site/styles.css site/site.js _site/site/
          cp assets/joy.svg assets/ownership.svg assets/claude.cast assets/copilot.cast _site/assets/
          touch _site/.nojekyll
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
